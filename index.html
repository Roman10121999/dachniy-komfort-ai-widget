<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
ИИ-помощник Дачный комфорт
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<!-- Кнопка открытия помощника -->

<div id="ai-widget-button">

💬

</div>




<!-- Окно AI помощника -->

<div id="ai-widget-window">



<!-- Шапка -->

<div class="ai-header">


<img 
src="assets/assistant.png"
class="assistant-avatar"
>


<div class="assistant-info">


<div class="assistant-title">

ИИ-помощник

</div>


<div class="assistant-company">

Дачный комфорт

</div>


</div>


</div>





<!-- История сообщений -->

<div id="chat-history">


</div>





<!-- Индикатор печати -->

<div id="typing-indicator">


</div>





<!-- Быстрые ответы AI -->

<div id="options-panel">


</div>





<!-- Карточки TOP-3 -->

<div id="products-container">


</div>





<!-- Поле сообщения -->

<div class="input-area">


<textarea
  id="user-input"
  rows="1"
  placeholder="Напишите сообщение..."
></textarea>


<button id="send-button">

➤

</button>


</div>




</div>





<script src="script.js"></script>


</body>


</html>

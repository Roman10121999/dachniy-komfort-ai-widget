<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
ИИ-помощник Дачный комфорт
</title>


<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- Кнопка открытия -->

<div id="ai-widget-button">

💬

</div>



<!-- Основное окно AI -->

<div id="ai-widget-window">



<!-- Шапка -->

<div class="ai-header">


<img
src="assets/assistant.png"
class="assistant-avatar"
>


<div>

<div class="assistant-title">

ИИ-помощник

</div>


<div class="assistant-company">

Дачный комфорт

</div>


</div>


</div>





<!-- История диалога -->

<div id="chat-history">


</div>




<!-- Индикатор печати AI -->

<div id="typing-indicator">


</div>





<!-- Ответы / быстрые кнопки AI -->

<div id="options-panel">


</div>





<!-- Карточки товаров TOP-3 -->

<div id="products-container">


</div>





<!-- Поле ввода -->

<div class="input-area">


<input
id="user-input"
type="text"
placeholder="Введите сообщение..."
>


<button id="send-button">

➤

</button>


</div>




</div>





<script src="script.js"></script>
